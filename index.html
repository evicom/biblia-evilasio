<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bíblia Sagrada — José Evilasio Marques</title>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #2d2d2d;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent: #d4af37; /* Dourado elegante */
            --accent-hover: #fbbf24;
            --border: #333333;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: var(--bg-primary); 
            color: var(--text-primary); 
            line-height: 1.6; 
        }
        
        /* Header & Toolbars */
        header { 
            background: var(--bg-secondary); 
            border-bottom: 1px solid var(--border); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: var(--shadow);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
            padding: 0.8rem 1rem;
        }

        .app-title { 
            font-size: 1.1rem; 
            font-weight: 700; 
            color: var(--accent); 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
            letter-spacing: 0.5px;
        }

        .toolbar { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 0.75rem; 
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .version-tabs { 
            display: flex; 
            justify-content: center; 
            gap: 0.5rem; 
            padding: 0.6rem 1rem;
            flex-wrap: wrap;
        }

        /* Botões de Ícone (Navegar, Buscar, Anotações) */
        .icon-btn { 
            background: var(--bg-tertiary); 
            border: 1px solid var(--border); 
            color: var(--text-primary); 
            width: 42px; 
            height: 42px; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.3rem; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .icon-btn:hover { 
            background: var(--accent); 
            color: var(--bg-primary); 
            border-color: var(--accent); 
            transform: translateY(-2px);
        }

        /* Controles de Fonte */
        .font-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-tertiary);
            padding: 0.2rem 0.6rem;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .font-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1.1rem;
            cursor: pointer;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: 0.2s;
        }
        .font-btn:hover { background: var(--border); }
        .font-display { font-size: 0.85rem; color: var(--text-secondary); min-width: 40px; text-align: center; }

        /* Botões de Versão */
        .version-btn { 
            background: transparent; 
            border: 1px solid var(--border); 
            color: var(--text-secondary); 
            padding: 0.4rem 1rem; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 0.85rem; 
            font-weight: 600; 
            transition: all 0.2s ease; 
        }
        .version-btn:hover, .version-btn.active { 
            background: var(--accent); 
            color: var(--bg-primary); 
            border-color: var(--accent); 
        }

        /* Barra de Navegação do Capítulo */
        .nav-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0.8rem 1rem; 
            background: var(--bg-primary); 
            border-bottom: 1px solid var(--border); 
            max-width: 900px;
            margin: 0 auto;
        }
        .nav-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
        #current-reference { 
            font-weight: 700; 
            color: var(--accent); 
            font-size: 1.1rem;
            text-align: center;
        }

        /* Leitor */
        #leitor-biblia { 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 2rem 1.5rem; 
            font-family: 'Georgia', 'Merriweather', serif; 
            font-size: 110%; 
            line-height: 1.8; 
            color: var(--text-primary);
        }
        .capitulo-titulo { 
            text-align: center; 
            color: var(--accent); 
            margin-bottom: 2rem; 
            font-size: 2rem; 
            font-weight: 700; 
        }
        .versiculo { 
            margin-bottom: 1rem; 
            text-align: justify; 
            cursor: pointer; 
            padding: 0.5rem; 
            border-radius: 6px; 
            transition: background 0.2s; 
        }
        .versiculo:hover { 
            background: rgba(212, 175, 55, 0.08); 
        }
        .num-verso { 
            color: var(--accent); 
            font-weight: bold; 
            font-size: 0.75em; 
            vertical-align: super; 
            margin-right: 0.3rem; 
            cursor: pointer; 
        }
        .num-verso:hover { text-decoration: underline; }

        /* Loading */
        #loading { 
            display: none; 
            text-align: center; 
            padding: 3rem; 
            font-size: 1.1rem; 
            color: var(--accent); 
        }

        /* Modais */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); 
            backdrop-filter: blur(4px);
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
        }
        .modal-content { 
            background: var(--bg-secondary); 
            border: 1px solid var(--border);
            padding: 1.5rem; 
            border-radius: 12px; 
            width: 90%; 
            max-width: 500px; 
            max-height: 80vh; 
            overflow-y: auto; 
            position: relative; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 1rem; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 0.8rem; 
        }
        .modal-header h3 { color: var(--accent); }
        .close { 
            font-size: 1.8rem; 
            cursor: pointer; 
            color: var(--text-secondary); 
            line-height: 1;
            transition: 0.2s;
        }
        .close:hover { color: var(--text-primary); }

        /* Elementos de Formulário no Modal */
        select, input, textarea { 
            width: 100%; 
            padding: 0.7rem; 
            background: var(--bg-tertiary); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            color: var(--text-primary); 
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 0.8rem;
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 0.7rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: 0.2s;
        }
        .btn-primary:hover { background: var(--accent-hover); }

        /* Resultados de Busca */
        .search-result { 
            padding: 0.8rem; 
            border-bottom: 1px solid var(--border); 
            cursor: pointer; 
            border-radius: 6px;
            transition: 0.2s;
        }
        .search-result:hover { background: var(--bg-tertiary); }
        .search-ref { font-weight: bold; color: var(--accent); font-size: 0.9rem; margin-bottom: 0.2rem; }
        .search-result mark { background: rgba(212, 175, 55, 0.3); color: var(--text-primary); padding: 0 2px; border-radius: 2px; }

        /* Anotações Salvas */
        .saved-note-item {
            padding: 0.8rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: 0.2s;
        }
        .saved-note-item:hover { background: var(--bg-tertiary); }

        /* Botões de Compartilhamento */
        .share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 1rem; }
        .share-btn { 
            padding: 0.7rem; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            cursor: pointer; 
            text-align: center; 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 600;
            transition: 0.2s;
        }
        .share-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .whatsapp { background: #25D366; }
        .telegram { background: #0088cc; }
        .facebook { background: #3b5998; }
        .twitter { background: #000000; border: 1px solid #333; }
        .copy { background: var(--bg-tertiary); color: var(--text-primary); grid-column: span 2; border: 1px solid var(--border); }

        /* Footer */
        footer { 
            text-align: center; 
            padding: 2rem 1rem; 
            background: var(--bg-secondary); 
            border-top: 1px solid var(--border);
            color: var(--text-secondary); 
            font-size: 0.85rem; 
            margin-top: 3rem; 
        }
    </style>
</head>
<body>

<header>
    <div class="top-bar">
        <div class="app-title">✝️ Bíblia Sagrada</div>
        <div style="font-size: 0.8rem; color: var(--text-secondary);">José Evilasio Marques</div>
    </div>
    
    <div class="toolbar">
        <button class="icon-btn" title="Navegar" onclick="openModal('modal-nav')">📖</button>
        <button class="icon-btn" title="Buscar" onclick="openModal('modal-search')">🔍</button>
        <button class="icon-btn" title="Anotações" onclick="openModal('modal-notes')">📝</button>
        
        <div class="font-controls">
            <button class="font-btn" onclick="changeFontSize(-10)" title="Diminuir fonte">−</button>
            <span id="font-size-display" class="font-display">110%</span>
            <button class="font-btn" onclick="changeFontSize(10)" title="Aumentar fonte">+</button>
        </div>
    </div>

    <div class="version-tabs" id="version-buttons">
        <!-- Botões de versão gerados via JS -->
    </div>
</header>

<div class="nav-bar">
    <button class="nav-btn" onclick="changeChapter(-1)">◀ Anterior</button>
    <span id="current-reference">Gênesis 1</span>
    <button class="nav-btn" onclick="changeChapter(1)">Próximo ▶</button>
</div>

<div id="loading">Carregando Escrituras...</div>
<div id="leitor-biblia"></div>

<footer>
    Bíblia Sagrada v2.0 · José Evilasio Marques · © 2025
</footer>

<!-- MODAL DE NAVEGAÇÃO -->
<div id="modal-nav" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📖 Navegar</h3>
            <span class="close" onclick="closeModal('modal-nav')">&times;</span>
        </div>
        <select id="select-book" onchange="updateChapterSelect()"></select>
        <select id="select-chapter" onchange="goToChapter()"></select>
    </div>
</div>

<!-- MODAL DE BUSCA -->
<div id="modal-search" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>🔍 Busca</h3>
            <span class="close" onclick="closeModal('modal-search')">&times;</span>
        </div>
        <div style="display:flex; gap:0.5rem;">
            <input type="text" id="search-input" placeholder="Digite pelo menos 3 letras..." style="margin-bottom:0;">
            <button class="btn-primary" style="width: auto; padding: 0 1.2rem;" onclick="performSearch()">Buscar</button>
        </div>
        <div id="search-results" style="margin-top:1rem;"></div>
    </div>
</div>

<!-- MODAL DE ANOTAÇÕES -->
<div id="modal-notes" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📝 Anotações</h3>
            <span class="close" onclick="closeModal('modal-notes')">&times;</span>
        </div>
        <p id="note-reference" style="font-weight:bold; color:var(--accent); margin-bottom:0.5rem;"></p>
        <textarea id="note-text" placeholder="Escreva sua anotação aqui..." rows="4"></textarea>
        <button class="btn-primary" onclick="saveNote()">💾 Salvar Anotação</button>
        <div style="margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem;">
            <h4 style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Anotações Salvas:</h4>
            <div id="saved-notes-list" style="max-height:200px; overflow-y:auto;"></div>
        </div>
    </div>
</div>

<!-- MODAL DE COMPARTILHAMENTO -->
<div id="modal-share" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Compartilhar</h3>
            <span class="close" onclick="closeModal('modal-share')">&times;</span>
        </div>
        <p id="share-text" style="font-style:italic; background:var(--bg-tertiary); padding:1rem; border-left:3px solid var(--accent); border-radius: 0 8px 8px 0; margin-bottom:1rem; line-height: 1.6;"></p>
        <div class="share-grid">
            <a id="share-wa" class="share-btn whatsapp" target="_blank">💬 WhatsApp</a>
            <a id="share-tg" class="share-btn telegram" target="_blank">✈️ Telegram</a>
            <a id="share-fb" class="share-btn facebook" target="_blank">f Facebook</a>
            <a id="share-tw" class="share-btn twitter" target="_blank">𝕏 Twitter/X</a>
            <button class="share-btn copy" onclick="copyToClipboard()">📋 Copiar Texto</button>
        </div>
    </div>
</div>

<script>
    // --- ESTADO DA APLICAÇÃO ---
    const state = {
        version: 'arc',
        bookIndex: 0,
        chapterIndex: 0,
        fontSize: 110,
        data: null,
        notes: JSON.parse(localStorage.getItem('biblia_notas') || '{}')
    };

    const versions = { 'ARC': 'arc', 'ACF': 'acf', 'NVI': 'nvi', 'AA': 'aa', 'KJA': 'kja' };

    // --- INICIALIZAÇÃO ---
    document.addEventListener('DOMContentLoaded', () => {
        renderVersionButtons();
        loadVersion('ARC');
    });

    function renderVersionButtons() {
        const container = document.getElementById('version-buttons');
        container.innerHTML = '';
        for (const [label, key] of Object.entries(versions)) {
            const btn = document.createElement('button');
            btn.className = `version-btn ${state.version === key ? 'active' : ''}`;
            btn.textContent = label;
            btn.onclick = () => loadVersion(label);
            container.appendChild(btn);
        }
    }

    // --- CARREGAMENTO DOS DADOS ---
    async function loadVersion(versionLabel) {
        state.version = versions[versionLabel];
        document.getElementById('loading').style.display = 'block';
        document.getElementById('leitor-biblia').innerHTML = '';
        
        document.querySelectorAll('.version-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent === versionLabel);
        });

        try {
            const response = await fetch(`pt-br/${state.version}.json`);
            if (!response.ok) throw new Error('Falha ao carregar');
            state.data = await response.json();
            
            state.bookIndex = 0;
            state.chapterIndex = 0;
            updateBookChapterSelectors();
            renderChapter();
        } catch (error) {
            console.error("Erro ao carregar a versão:", error);
            document.getElementById('leitor-biblia').innerHTML = 
                `<p style="color:#ef4444; text-align:center; padding: 2rem;">Erro ao carregar os dados. Verifique se a pasta <strong>pt-br/</strong> e o arquivo <strong>${state.version}.json</strong> existem.</p>`;
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    // --- RENDERIZAÇÃO ---
    function renderChapter() {
        const book = state.data[state.bookIndex];
        const chapter = book.chapters[state.chapterIndex];
        const reader = document.getElementById('leitor-biblia');
        
        reader.innerHTML = `<h2 class="capitulo-titulo">${book.name} ${state.chapterIndex + 1}</h2>`;
        document.getElementById('current-reference').textContent = `${book.name} ${state.chapterIndex + 1}`;

        chapter.forEach((verseText, index) => {
            const verseNum = index + 1;
            const ref = `${book.name} ${state.chapterIndex + 1}:${verseNum}`;
            const safeText = verseText.replace(/'/g, "\\'");
            
            const p = document.createElement('p');
            p.className = 'versiculo';
            p.innerHTML = `<sup class="num-verso" onclick="event.stopPropagation(); openShareModal('${ref}', '${safeText}')">${verseNum}</sup> ${verseText}`;
            
            p.onclick = () => openNoteModal(ref, verseText);
            reader.appendChild(p);
        });
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- NAVEGAÇÃO ---
    function changeChapter(direction) {
        const book = state.data[state.bookIndex];
        const newChapter = state.chapterIndex + direction;
        
        if (newChapter >= 0 && newChapter < book.chapters.length) {
            state.chapterIndex = newChapter;
            renderChapter();
        } else if (direction > 0 && state.bookIndex < state.data.length - 1) {
            state.bookIndex++;
            state.chapterIndex = 0;
            renderChapter();
        } else if (direction < 0 && state.bookIndex > 0) {
            state.bookIndex--;
            state.chapterIndex = state.data[state.bookIndex].chapters.length - 1;
            renderChapter();
        }
    }

    function updateBookChapterSelectors() {
        const bookSelect = document.getElementById('select-book');
        bookSelect.innerHTML = state.data.map((book, idx) => 
            `<option value="${idx}" ${idx === state.bookIndex ? 'selected' : ''}>${book.name}</option>`
        ).join('');
        updateChapterSelect();
    }

    function updateChapterSelect() {
        state.bookIndex = parseInt(document.getElementById('select-book').value);
        const book = state.data[state.bookIndex];
        const chapSelect = document.getElementById('select-chapter');
        chapSelect.innerHTML = book.chapters.map((_, idx) => 
            `<option value="${idx}" ${idx === state.chapterIndex ? 'selected' : ''}>Capítulo ${idx + 1}</option>`
        ).join('');
    }

    function goToChapter() {
        state.chapterIndex = parseInt(document.getElementById('select-chapter').value);
        renderChapter();
        closeModal('modal-nav');
    }

    // --- FUNCIONALIDADES DE UI ---
    function changeFontSize(delta) {
        state.fontSize = Math.max(80, Math.min(200, state.fontSize + delta));
        document.getElementById('leitor-biblia').style.fontSize = `${state.fontSize}%`;
        document.getElementById('font-size-display').textContent = `${state.fontSize}%`;
    }

    function openModal(id) {
        document.getElementById(id).style.display = 'flex';
        if (id === 'modal-notes') renderSavedNotes();
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    window.onclick = (event) => {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    };

    // --- BUSCA ---
    function performSearch() {
        const query = document.getElementById('search-input').value.trim().toLowerCase();
        const resultsDiv = document.getElementById('search-results');
        
        if (query.length < 3) {
            resultsDiv.innerHTML = '<p style="color:var(--text-secondary); text-align:center;">Digite pelo menos 3 caracteres.</p>';
            return;
        }

        resultsDiv.innerHTML = '<p style="color:var(--accent); text-align:center;">Buscando...</p>';
        
        setTimeout(() => {
            const results = [];
            state.data.forEach((book, bIdx) => {
                book.chapters.forEach((chapter, cIdx) => {
                    chapter.forEach((verse, vIdx) => {
                        if (verse.toLowerCase().includes(query)) {
                            results.push({
                                ref: `${book.name} ${cIdx + 1}:${vIdx + 1}`,
                                text: verse,
                                bIdx, cIdx
                            });
                        }
                    });
                });
            });

            if (results.length === 0) {
                resultsDiv.innerHTML = '<p style="color:var(--text-secondary); text-align:center;">Nenhum resultado encontrado.</p>';
            } else {
                resultsDiv.innerHTML = results.slice(0, 50).map(r => `
                    <div class="search-result" onclick="jumpTo(${r.bIdx}, ${r.cIdx}); closeModal('modal-search');">
                        <div class="search-ref">${r.ref}</div>
                        <div style="font-size: 0.95rem;">${r.text.replace(new RegExp(query, 'gi'), match => `<mark>${match}</mark>`)}</div>
                    </div>
                `).join('') + (results.length > 50 ? `<p style="text-align:center; color:var(--text-secondary); margin-top:1rem; font-size:0.9rem;">...e mais ${results.length - 50} resultados.</p>` : '');
            }
        }, 100);
    }

    function jumpTo(bIdx, cIdx) {
        state.bookIndex = bIdx;
        state.chapterIndex = cIdx;
        updateBookChapterSelectors();
        renderChapter();
    }

    // --- ANOTAÇÕES ---
    let currentNoteRef = '';

    function openNoteModal(ref, text) {
        currentNoteRef = ref;
        document.getElementById('note-reference').textContent = ref;
        document.getElementById('note-text').value = state.notes[ref] || '';
        openModal('modal-notes');
    }

    function saveNote() {
        const text = document.getElementById('note-text').value.trim();
        if (text) {
            state.notes[currentNoteRef] = text;
        } else {
            delete state.notes[currentNoteRef];
        }
        localStorage.setItem('biblia_notas', JSON.stringify(state.notes));
        
        // Feedback visual sutil
        const btn = document.querySelector('#modal-notes .btn-primary');
        const originalText = btn.textContent;
        btn.textContent = '✅ Salvo!';
        setTimeout(() => btn.textContent = originalText, 1500);
        
        renderSavedNotes();
    }

    function renderSavedNotes() {
        const list = document.getElementById('saved-notes-list');
        const refs = Object.keys(state.notes);
        if (refs.length === 0) {
            list.innerHTML = '<p style="color:var(--text-secondary); font-size:0.9rem; text-align:center;">Nenhuma anotação salva ainda.</p>';
            return;
        }
        list.innerHTML = refs.map(ref => `
            <div class="saved-note-item" onclick="document.getElementById('note-reference').textContent='${ref}'; document.getElementById('note-text').value=state.notes['${ref}']; currentNoteRef='${ref}';">
                <div style="color:var(--accent); font-size:0.85rem; font-weight:600; margin-bottom:0.2rem;">${ref}</div>
                <div style="font-size:0.9rem; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${state.notes[ref]}</div>
            </div>
        `).join('');
    }

    // --- COMPARTILHAMENTO ---
    function openShareModal(ref, text) {
        const fullText = `"${text}"\n\n${ref} — Bíblia Sagrada`;
        const encodedText = encodeURIComponent(fullText);
        const url = encodeURIComponent(window.location.href);

        document.getElementById('share-text').textContent = fullText;
        document.getElementById('share-wa').href = `https://wa.me/?text=${encodedText}`;
        document.getElementById('share-tg').href = `https://t.me/share/url?url=${url}&text=${encodedText}`;
        document.getElementById('share-fb').href = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
        document.getElementById('share-tw').href = `https://twitter.com/intent/tweet?text=${encodedText}`;
        
        openModal('modal-share');
    }

    function copyToClipboard() {
        const text = document.getElementById('share-text').textContent;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.querySelector('.share-btn.copy');
            const originalText = btn.textContent;
            btn.textContent = '✅ Copiado!';
            setTimeout(() => btn.textContent = originalText, 2000);
        }).catch(err => {
            console.error('Erro ao copiar:', err);
        });
    }
</script>

</body>
</html>
